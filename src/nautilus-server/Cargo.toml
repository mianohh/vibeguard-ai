[package]
name = "vibeguard-nautilus-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP Server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "2ae161a" }
rand = "0.8"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Encoding
base64 = "0.21"
hex = "0.4"

# HTTP client (Walrus upload from inside enclave)
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "nautilus_server"
path = "src/lib.rs"

[[bin]]
name = "nautilus-server"
path = "src/main.rs"
